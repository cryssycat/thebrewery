<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>World</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Saira+Extra+Condensed:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css">
</head>
<body>

<div class="wrap">
  <div id="site-nav"></div>
  <div class="topbar">
    <a class="back-link" id="back-link" href="index.html" style="margin:0">&larr; Back to hub</a>
    <span id="edit-link-wrap"><a class="edit-link" id="edit-link" href="#">Edit this character</a></span>
  </div>

  <div id="header-card" class="glass">
    <div id="header-loading">
      <div class="skeleton" style="width:220px;height:26px;margin-bottom:16px"></div>
      <div class="skeleton" style="width:340px"></div>
    </div>
    <div id="header-content" style="display:none">
      <h1 id="char-name"></h1>
      <div class="credits" id="credits-row"></div>
      <div class="tags-row" id="tags-row"></div>
    </div>
  </div>

  <div class="divider-host" id="div-profile" style="display:none"></div>
  <div id="profile-card" class="glass">
    <div id="profile-state" class="state" style="display:none"></div>
    <div id="profile-body" style="display:none"></div>
  </div>

  <div class="divider-host" id="div-gallery" style="display:none"></div>
  <div id="gallery-section" class="glass" style="display:none">
    <h2>Gallery</h2>
    <div class="gal-total" id="gal-total" style="display:none"></div>
    <div class="gal-tabs" id="gallery-tabs"></div>
    <div class="gallery-grid" id="gallery-grid"></div>
  </div>
</div>

<div class="lightbox-overlay" id="lightbox" style="display:none">
  <button class="lightbox-close" id="lightbox-close" aria-label="Close">&times;</button>
  <div class="lightbox-content">
    <img id="lightbox-img" src="" alt="">
    <div class="lightbox-credit" id="lightbox-credit"></div>
  </div>
</div>

<script src="site.js"></script>
<script>
const API_BASE = "https://thebrewery.crysthigpen.workers.dev";
const authHeaders = () => {
  const t = localStorage.getItem("brewery_token");
  return t ? { Authorization: `Bearer ${t}` } : {};
};

renderNav(null);
renderChrome(null);
const params = new URLSearchParams(window.location.search);
const slug = params.get("slug");

if (!slug) {
  showState("No character specified.");
} else {
  loadProfile(slug);
}

async function loadProfile(slug) {
  try {
    const res = await fetch(`${API_BASE}/api/characters/${encodeURIComponent(slug)}`, { headers: authHeaders() });
    if (res.status === 404) return showState("This character doesn't exist or isn't public yet.");
    if (!res.ok) return showState("Couldn't load this profile right now.");

    const c = await res.json();
    const sec = sectionOf(c.collection);
    renderNav(c.collection);
    renderChrome(c.collection);
    if (!(sec && sec.worlds)) return location.replace(`profile.html?slug=${encodeURIComponent(c.slug)}`);
    if (sec) {
      const b = document.getElementById("back-link");
      b.href = `member.html?collection=${encodeURIComponent(sec.collection)}`;
      b.innerHTML = `&larr; Back to ${escapeHtml(sec.label)}`;
    }
    renderHeader(c);
    renderProfile(c);
    loadGallery(slug, parseProfile(c.profile_html).meta.gal);
    showEditLinkIfAuthed(c.slug);
  } catch {
    showState("Couldn't load this profile right now.");
  }
}

async function showEditLinkIfAuthed(slug) {
  let ok = localStorage.getItem("brewery_editor") === "1";
  try {
    const res = await fetch(`${API_BASE}/api/session`, { credentials: "include", headers: authHeaders() });
    if (res.ok) { ok = true; localStorage.setItem("brewery_editor", "1"); }
  } catch {}
  if (!ok) return;
  document.getElementById("edit-link").href = `editor.html?slug=${encodeURIComponent(slug)}`;
  document.getElementById("edit-link-wrap").style.display = "inline-block";
}

async function loadGallery(slug, gal) {
  try {
    const res = await fetch(`${API_BASE}/api/gallery/${encodeURIComponent(slug)}`, { headers: authHeaders() });
    if (!res.ok) return;
    const items = await res.json();
    if (!items.length) return;
    const secMap = (gal && gal.sec) || {}, titles = (gal && gal.titles) || {}, vals = (gal && gal.val) || {};
    const total = items.reduce((t, i) => t + (Number(vals[i.id]) || 0), 0);
    if (total > 0) {
      const tot = document.getElementById("gal-total");
      tot.textContent = `${SITE.valueLabel}: ${SITE.valueCurrency}${total.toLocaleString(undefined, { maximumFractionDigits: 2 })}`;
      tot.style.display = "block";
    }
    const groups = [{ id: "", label: "Gallery", items: [] }, ...SITE.gallerySections.map((d) => ({ id: d.id, label: (d.custom && titles[d.id]) || d.label, nsfw: !!d.nsfw, items: [] }))];
    items.forEach((img) => (groups.find((g) => g.id && g.id === secMap[img.id]) || groups[0]).items.push(img));
    const tabs = groups.filter((g) => g.items.length);
    const bar = document.getElementById("gallery-tabs"), grid = document.getElementById("gallery-grid");
    const show = (g) => {
      grid.innerHTML = g.items.map((img) => `<button type="button" class="gallery-thumb${g.nsfw ? " nsfw" : ""}"><img src="${img.url}" alt="${escapeAttr(img.name)}" loading="lazy"></button>`).join("");
      grid.querySelectorAll(".gallery-thumb").forEach((btn, i) => btn.addEventListener("click", () => { if (btn.classList.contains("nsfw")) return btn.classList.remove("nsfw"); openLightbox(g.items[i]); }));
      bar.querySelectorAll("button").forEach((b) => b.classList.toggle("active", b.dataset.id === g.id));
    };
    bar.innerHTML = tabs.length > 1 ? tabs.map((g) => `<button type="button" data-id="${escapeAttr(g.id)}">${escapeHtml(g.label)}</button>`).join("") : "";
    bar.querySelectorAll("button").forEach((b, i) => b.addEventListener("click", () => show(tabs[i])));
    document.querySelector("#gallery-section h2").textContent = tabs.length === 1 ? tabs[0].label : "Gallery";
    show(tabs[0]);
    document.getElementById("gallery-section").style.display = "block";
    document.getElementById("div-gallery").style.display = "block";
  } catch {
    // Gallery is a bonus section — fail quietly if it doesn't load.
  }
}

function openLightbox(image) {
  document.getElementById("lightbox-img").src = image.url;
  document.getElementById("lightbox-img").alt = image.name;
  const creditEl = document.getElementById("lightbox-credit");
  const credits = image.credits || [];
  if (credits.length > 0) {
    creditEl.innerHTML = credits.map((c) => {
      const label = c.role ? `${escapeHtml(c.role)}: ` : "";
      const nameHtml = c.url
        ? `<a href="${escapeAttr(c.url)}" target="_blank" rel="noopener">${escapeHtml(c.name)}</a>`
        : escapeHtml(c.name);
      return `<div>${label}${nameHtml}</div>`;
    }).join("");
    creditEl.style.display = "block";
  } else {
    creditEl.style.display = "none";
  }
  document.getElementById("lightbox").style.display = "flex";
}
function closeLightbox() {
  document.getElementById("lightbox").style.display = "none";
}
document.getElementById("lightbox-close").addEventListener("click", closeLightbox);
document.getElementById("lightbox").addEventListener("click", (e) => {
  if (e.target.id === "lightbox") closeLightbox();
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && document.getElementById("lightbox").style.display !== "none") closeLightbox();
});

function renderHeader(c) {
  document.title = c.name ? `${c.name} — world` : "Character profile";
  document.getElementById("char-name").textContent = c.name || c.slug;

  const credits = [];
  if (c.artist) credits.push(creditItem("Art", c.artist, c.artist_url));
  if (c.designer) credits.push(creditItem("Design", c.designer, c.designer_url));
  document.getElementById("credits-row").innerHTML = credits.join("");

  const tags = visibleTags(c);
  document.getElementById("tags-row").innerHTML = tags.map((t) => `<span class="tag-pill">${escapeHtml(t)}</span>`).join("");

  document.getElementById("header-loading").style.display = "none";
  document.getElementById("header-content").style.display = "block";
  document.getElementById("div-profile").style.display = "block";
}

function creditItem(label, name, url) {
  const value = url ? `<a href="${escapeAttr(url)}" target="_blank" rel="noopener">${escapeHtml(name)}</a>` : escapeHtml(name);
  return `<span class="credit-item">${label}: <strong>${value}</strong></span>`;
}

function renderProfile(c) {
  const p = parseProfile(c.profile_html);
  const order = SITE.worldTabs.map((d) => d.id);
  let tabs = p.tabs.map((t) => {
    const d = SITE.worldTabs.find((x) => x.id === t.id);
    return { id: t.id, label: t.title || (d && d.label) || t.id, html: t.html };
  }).filter((t) => t.html).sort((a, b) => order.indexOf(a.id) - order.indexOf(b.id));
  if (!tabs.length && p.body) tabs = [{ id: "overview", label: "Overview", html: p.body }];
  const body = document.getElementById("profile-body");
  const style = document.createElement("style");
  style.textContent = c.profile_css || "";
  const bar = document.createElement("div");
  bar.className = "world-tabs";
  const slot = document.createElement("div");
  slot.className = `char-slot char-${c.slug}`;
  const show = (t) => {
    slot.innerHTML = t ? t.html : "<p>This world doesn't have an info page yet.</p>";
    bar.querySelectorAll("button").forEach((b) => b.classList.toggle("active", !!t && b.dataset.id === t.id));
  };
  bar.innerHTML = tabs.map((t) => `<button type="button" data-id="${escapeAttr(t.id)}">${escapeHtml(t.label)}</button>`).join("");
  bar.querySelectorAll("button").forEach((b, i) => b.addEventListener("click", () => show(tabs[i])));
  body.innerHTML = "";
  body.append(style);
  if (tabs.length > 1) body.append(bar);
  body.append(slot);
  show(tabs[0]);
  body.style.display = "block";
}

function showState(message) {
  document.getElementById("header-loading").style.display = "none";
  const stateEl = document.getElementById("profile-state");
  stateEl.innerHTML = `<div class="big">${escapeHtml(message)}</div><a href="index.html">Back to hub</a>`;
  stateEl.style.display = "block";
}

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
}
function escapeAttr(str) { return escapeHtml(str); }
</script>
</body>
</html>
