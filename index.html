<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Brewery</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
  :root{--bg-deep:#0b1120;--bg-panel:rgba(255,255,255,0.04);--border:rgba(255,255,255,0.09);--border-strong:rgba(255,255,255,0.18);--text:#e7ecf5;--text-dim:#8b94a8;--accent:#7f9cf5;--accent-dim:#4c5f9c;--radius:14px;font-family:-apple-system,"Segoe UI",Inter,sans-serif}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 10%,rgba(127,156,245,0.10),transparent 40%),radial-gradient(circle at 85% 90%,rgba(127,156,245,0.06),transparent 45%),var(--bg-deep);color:var(--text)}
  a{color:var(--accent);text-decoration:none}
  .wrap{max-width:1040px;margin:0 auto;padding:32px 20px 64px}
  .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
  .brand{font-size:15px;font-weight:600}
  #edit-link{display:none;font-size:13px;color:var(--text-dim);padding:6px 14px;border:1px solid var(--border);border-radius:999px}
  #edit-link:hover{color:var(--text);border-color:var(--border-strong)}
  .glass{background:var(--bg-panel);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--border);border-radius:var(--radius)}
  #home-body{padding:28px;line-height:1.6;font-size:15px}
  #home-body img{max-width:100%;border-radius:8px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><span class="brand">The Brewery</span><a id="edit-link" href="#">Edit this page</a></div>
  <div id="site-nav"></div>
  <div class="glass"><div id="home-body"></div></div>
</div>
<script src="site.js"></script>
<script>
const API_BASE = "https://thebrewery.crysthigpen.workers.dev";
const authHeaders = () => {
  const t = localStorage.getItem("brewery_token");
  return t ? { Authorization: `Bearer ${t}` } : {};
};
renderNav("home");
loadHome();

async function loadHome() {
  let c = null;
  try {
    const r = await fetch(`${API_BASE}/api/characters/${SITE.homeSlug}`, { headers: authHeaders() });
    if (r.ok) c = await r.json();
  } catch {}
  const p = parseProfile(c && c.profile_html);
  const has = c && p.body;
  document.getElementById("home-body").innerHTML = has ? p.body
    : "<h1>Welcome to The Brewery</h1><p>Our characters, worlds, and mascots all live here. Pick a section above to start browsing.</p>";
  if (has && c.profile_css) {
    const s = document.createElement("style");
    s.textContent = c.profile_css;
    document.head.appendChild(s);
  }
  try {
    const r = await fetch(`${API_BASE}/api/session`, { credentials: "include", headers: authHeaders() });
    if (r.ok) {
      const a = document.getElementById("edit-link");
      a.href = c ? `editor.html?slug=${SITE.homeSlug}`
        : `editor.html?new=1&collection=${encodeURIComponent(SITE.homeCollection)}&slug=${SITE.homeSlug}&name=About%20us`;
      a.style.display = "inline";
    }
  } catch {}
}
</script>
</body>
</html>
