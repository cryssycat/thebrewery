<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Brewery</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Saira+Extra+Condensed:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css">
</head>
<body>
<div class="wrap">
  <div class="top"><a id="edit-link" href="#">Edit this page</a></div>
  <div id="site-nav"></div>
  <div class="glass plain"><div id="home-body"></div></div>
</div>
<script src="site.js"></script>
<script>
const API_BASE = "https://thebrewery.crysthigpen.workers.dev";
const authHeaders = () => {
  const t = localStorage.getItem("brewery_token");
  return t ? { Authorization: `Bearer ${t}` } : {};
};
renderNav("home");
renderChrome("home");
loadHome();

async function loadHome() {
  let c = null;
  try {
    const r = await fetch(`${API_BASE}/api/characters/${SITE.homeSlug}`, { headers: authHeaders() });
    if (r.ok) c = await r.json();
  } catch {}
  const p = parseProfile(c && c.profile_html);
  const has = c && p.body;
  document.getElementById("home-body").innerHTML = has ? p.body
    : "<h1>Welcome to The Brewery</h1><p>Our characters, worlds, and mascots all live here. Pick a section above to start browsing.</p>";
  if (has && c.profile_css) {
    const s = document.createElement("style");
    s.textContent = c.profile_css;
    document.head.appendChild(s);
  }
  try {
    const r = await fetch(`${API_BASE}/api/session`, { credentials: "include", headers: authHeaders() });
    if (r.ok) {
      const a = document.getElementById("edit-link");
      a.href = c ? `editor.html?slug=${SITE.homeSlug}`
        : `editor.html?new=1&collection=${encodeURIComponent(SITE.homeCollection)}&slug=${SITE.homeSlug}&name=About%20us`;
      a.style.display = "inline";
    }
  } catch {}
}
</script>
</body>
</html>
