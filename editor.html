<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Character editor</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css">
<style>
  :root{
    --bg-deep:#0b1120;
    --bg-panel:rgba(255,255,255,0.04);
    --bg-panel-solid:#131c2e;
    --border:rgba(255,255,255,0.09);
    --border-strong:rgba(255,255,255,0.18);
    --text:#e7ecf5;
    --text-dim:#8b94a8;
    --accent:#7f9cf5;
    --accent-dim:#4c5f9c;
    --danger:#e46a6a;
    --radius:14px;
    font-family:-apple-system,"Segoe UI",Inter,sans-serif;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(circle at 15% 10%, rgba(127,156,245,0.10), transparent 40%),
      radial-gradient(circle at 85% 90%, rgba(127,156,245,0.06), transparent 45%),
      var(--bg-deep);
    color:var(--text);
  }
  .glass{
    background:var(--bg-panel);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    border:1px solid var(--border);
    border-radius:var(--radius);
  }
  a{color:var(--accent)}
  input,select,textarea,button{font-family:inherit}

  /* ---------- Login screen ---------- */
  #login-screen{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  #login-card{
    width:100%;
    max-width:340px;
    padding:32px;
  }
  #login-card h1{font-size:19px;font-weight:600;margin:0 0 22px}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:12px;color:var(--text-dim);margin-bottom:6px}
  .field input, .field select{
    width:100%;
    padding:10px 12px;
    background:rgba(255,255,255,0.03);
    border:1px solid var(--border);
    border-radius:10px;
    color:var(--text);
    font-size:14px;
    outline:none;
    transition:border-color .15s;
  }
  .field input:focus, .field select:focus{border-color:var(--accent-dim)}
  .btn{
    padding:10px 18px;
    border-radius:10px;
    border:1px solid var(--border-strong);
    background:var(--accent-dim);
    color:#fff;
    font-size:14px;
    font-weight:500;
    cursor:pointer;
    transition:filter .15s, transform .1s;
  }
  .btn:hover{filter:brightness(1.15)}
  .btn:active{transform:scale(0.98)}
  .btn.primary{background:var(--accent);border-color:var(--accent)}
  .btn.ghost{background:transparent}
  .btn.danger{background:transparent;border-color:var(--danger);color:var(--danger)}
  #login-error{color:var(--danger);font-size:13px;margin-top:12px;display:none}

  /* ---------- Editor screen ---------- */
  #editor-screen{display:none}
  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:16px 24px;
    border-bottom:1px solid var(--border);
  }
  header h1{font-size:15px;font-weight:600;margin:0}
  header .right{display:flex;align-items:center;gap:10px}
  #status-pill{
    font-size:12px;
    color:var(--text-dim);
    padding:4px 10px;
    border-radius:999px;
    border:1px solid var(--border);
  }
  #status-pill.saved{color:#7fd88f;border-color:rgba(127,216,143,0.4)}
  #status-pill.saving{color:var(--accent)}

  main{
    display:grid;
    grid-template-columns:280px 1fr 1fr;
    gap:16px;
    padding:16px 24px 24px;
    max-width:1400px;
    margin:0 auto;
  }
  @media(max-width:1000px){ main{grid-template-columns:1fr} }

  .middle-stack{display:flex;flex-direction:column;gap:16px;min-width:0}

  .panel{padding:18px}
  .panel h2{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-dim);margin:0 0 14px;font-weight:600}

  select.slug-select{margin-bottom:16px}

  .code-tabs{display:flex;gap:6px;margin-bottom:10px}
  .code-tabs button{
    flex:1;
    padding:8px;
    font-size:12px;
    border-radius:8px;
    border:1px solid var(--border);
    background:transparent;
    color:var(--text-dim);
    cursor:pointer;
  }
  .code-tabs button.active{background:var(--accent-dim);color:#fff;border-color:var(--accent-dim)}
  .CodeMirror{
    height:340px;
    border-radius:10px;
    border:1px solid var(--border);
    font-size:13px;
  }
  .cm-wrap{display:none}
  .cm-wrap.active{display:block}

  #preview-frame{
    width:100%;
    height:340px;
    border:1px solid var(--border);
    border-radius:10px;
    background:#fff;
  }

  .upload-zone{
    border:1px dashed var(--border-strong);
    border-radius:10px;
    padding:16px;
    text-align:center;
    font-size:12px;
    color:var(--text-dim);
    cursor:pointer;
    margin-top:10px;
  }
  .upload-zone:hover,.upload-zone.drag{border-color:var(--accent);color:var(--text)}
  .upload-zone{padding:28px 16px;font-size:13px}
  .gallery-thumb.err{border-color:var(--danger);color:var(--danger);padding:4px;font-size:10px;line-height:1.3}

  .gallery-grid{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:8px;
    margin-top:10px;
  }
  .gallery-thumb{
    position:relative;
    aspect-ratio:1;
    border-radius:8px;
    overflow:hidden;
    border:1px solid var(--border);
    background:rgba(255,255,255,0.03);
    cursor:pointer;
    padding:0;
  }
  .gallery-thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .gallery-thumb:hover{border-color:var(--accent)}
  .gallery-thumb.pending{display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--text-dim)}

  .lightbox-overlay{
    position:fixed;inset:0;
    background:rgba(0,0,0,0.75);
    display:flex;align-items:center;justify-content:center;
    padding:32px;
    z-index:1000;
  }
  .lightbox-content{max-width:min(720px, 90vw);max-height:90vh;overflow-y:auto;display:flex;flex-direction:column;gap:12px;align-items:center;padding:4px}
  .lightbox-content img{max-width:100%;max-height:38vh;border-radius:10px;display:block;flex-shrink:0}
  .credit-row{
    position:relative;
    display:flex;
    flex-direction:column;
    gap:6px;
    padding:12px 38px 12px 12px;
    border:1px solid var(--border);
    border-radius:10px;
    background:rgba(255,255,255,0.02);
  }
  .credit-row input{
    width:100%;
    padding:10px 12px;background:rgba(255,255,255,0.04);border:1px solid var(--border);
    border-radius:8px;color:var(--text);font-size:14px;outline:none;
  }
  .credit-row input:focus{border-color:var(--accent-dim)}
  .credit-row-remove{
    position:absolute;top:10px;right:10px;
    flex-shrink:0;width:26px;height:26px;border-radius:6px;border:1px solid var(--border);
    background:transparent;color:var(--text-dim);cursor:pointer;font-size:16px;line-height:1;
  }
  .credit-row-remove:hover{color:var(--danger);border-color:var(--danger)}
  .lightbox-actions{display:flex;gap:8px}
  .lightbox-close{
    position:absolute;top:20px;right:24px;
    background:none;border:none;color:#fff;font-size:22px;cursor:pointer;
    line-height:1;
  }

  .toggle-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}

  .tag-pill{
    display:inline-flex;align-items:center;gap:6px;
    padding:4px 6px 4px 10px;border-radius:999px;
    background:var(--accent-dim);color:#fff;font-size:12px;
  }
  .tag-pill-remove{
    background:none;border:none;color:rgba(255,255,255,0.8);cursor:pointer;
    font-size:13px;line-height:1;padding:2px;
  }
  .tag-pill-remove:hover{color:#fff}
  .toggle-row label{font-size:13px}
  .switch{
    width:38px;height:22px;border-radius:999px;
    background:rgba(255,255,255,0.1);
    position:relative;cursor:pointer;border:1px solid var(--border);
    transition:background .15s;
  }
  .switch.on{background:var(--accent)}
  .switch::after{
    content:"";position:absolute;top:2px;left:2px;
    width:16px;height:16px;border-radius:50%;background:#fff;
    transition:transform .15s;
  }
  .switch.on::after{transform:translateX(16px)}

  footer.actions{
    display:flex;
    justify-content:flex-end;
    gap:10px;
    padding:0 24px 32px;
    max-width:1400px;
    margin:0 auto;
  }
  .code-tabs{flex-wrap:wrap}
  .code-tabs button{flex:1 0 auto;padding:8px 10px}
  .code-tabs button.has::after{content:" \2022"}
  select{color-scheme:dark}
  select option{background:#131c2e;color:#e7ecf5}
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<div id="login-screen">
  <div id="login-card" class="glass">
    <h1>Sign in to edit</h1>
    <div class="field">
      <label for="login-user">Username</label>
      <input id="login-user" type="text" autocomplete="username">
    </div>
    <div class="field">
      <label for="login-pass">Password</label>
      <input id="login-pass" type="password" autocomplete="current-password">
    </div>
    <button class="btn primary" id="login-btn" style="width:100%">Sign in</button>
    <div id="login-error">Wrong username or password.</div>
  </div>
</div>

<!-- ============ EDITOR ============ -->
<div id="editor-screen">
  <header>
    <div style="display:flex;align-items:center;gap:14px">
      <a href="index.html" style="font-size:13px;color:var(--text-dim)">&larr; Character hub</a>
      <h1 style="margin:0">Character editor</h1>
    </div>
    <div class="right">
      <a id="view-link" href="#" target="_blank" style="font-size:13px;display:none">View profile &#8599;</a>
      <span id="status-pill">No changes</span>
      <button class="btn ghost" id="logout-btn">Log out</button>
    </div>
  </header>
  <div id="site-nav" style="max-width:1400px;margin:0 auto;padding:16px 24px 0"></div>

  <main>
    <!-- Left: fields -->
    <section class="panel glass">
      <h2>Character</h2>
      <select id="slug-select" class="slug-select"></select>

      <div class="field"><label>Name</label><input id="f-name"></div>
      <div class="field"><label>Slug</label><input id="f-slug" placeholder="new-character-slug"></div>
      <div class="field"><label>Section</label><select id="f-collection"></select></div>
      <div class="field" id="owners-field" style="display:none"><label>Co-owned by (up to 5, empty slots are hidden)</label><div id="owner-inputs"></div></div>
      <div class="field"><label>Avatar</label><input id="f-avatar-url" placeholder="Set via gallery, or paste a URL"></div>

      <div class="field">
        <label>Tags</label>
        <div id="tag-pills" style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px"></div>
        <div style="display:flex;gap:6px">
          <input id="f-tag-input" list="tag-suggestions" placeholder="e.g. Mated, Needs Ref" style="flex:1">
          <datalist id="tag-suggestions"></datalist>
          <button type="button" class="btn ghost" id="add-tag-btn" style="flex-shrink:0">+ Add</button>
        </div>
      </div>

      <div class="toggle-row">
        <label>Public</label>
        <div class="switch" id="visibility-switch"></div>
      </div>

      <h2 style="margin-top:22px">Credits</h2>
      <div class="field"><label>Artist</label><input id="f-artist"></div>
      <div class="field"><label>Artist link</label><input id="f-artist-url" placeholder="https://"></div>
      <div class="field"><label>Designer</label><input id="f-designer"></div>
      <div class="field"><label>Designer link</label><input id="f-designer-url" placeholder="https://"></div>
    </section>

    <!-- Middle: code editor + live preview, stacked -->
    <div class="middle-stack">
      <section class="panel glass">
        <h2>Profile code</h2>
        <div class="code-tabs" id="code-tabs"></div>
        <div class="field" id="tab-title-field" style="display:none"><input id="f-tab-title" placeholder="Tab title shown on the page"></div>
        <div class="cm-wrap active" id="wrap-html"><textarea id="cm-html"></textarea></div>
        <div class="cm-wrap" id="wrap-css"><textarea id="cm-css"></textarea></div>
      </section>

      <section class="panel glass">
        <h2>Live preview</h2>
        <iframe id="preview-frame"></iframe>
      </section>
    </div>

    <!-- Right: image upload -->
    <section class="panel glass">
      <h2>Image upload</h2>
      <div class="upload-zone" id="upload-zone">Drop images here, click to browse,<br>or paste from your clipboard</div>
      <input type="file" id="upload-input" accept="image/*" multiple style="display:none">
      <div id="upload-error" style="font-size:12px;margin-top:8px;color:var(--danger);display:none">Upload failed.</div>
      <div class="gallery-grid" id="upload-gallery"></div>
    </section>
  </main>

  <footer class="actions">
    <button class="btn danger" id="delete-btn">Delete</button>
    <button class="btn primary" id="save-btn">Save changes</button>
  </footer>
</div>

<div class="lightbox-overlay" id="lightbox" style="display:none">
  <button class="lightbox-close" id="lightbox-close" aria-label="Close">&times;</button>
  <div class="lightbox-content">
    <img id="lightbox-img" src="" alt="">
    <div style="width:100%;max-width:540px;display:flex;flex-direction:column;gap:10px;max-height:280px;overflow-y:auto;border:1px solid var(--border);border-radius:8px;padding:10px;flex-shrink:0" id="lightbox-credits-list"></div>
    <button class="btn ghost" id="lightbox-add-credit" style="align-self:flex-start;font-size:13px;flex-shrink:0">+ Add credit</button>
    <div class="lightbox-actions" style="flex-shrink:0">
      <button class="btn danger" id="lightbox-delete">Delete</button>
      <button class="btn" id="lightbox-copy">Copy URL</button>
      <button class="btn" id="lightbox-avatar">Use as avatar</button>
      <button class="btn" id="lightbox-save">Save credits</button>
      <button class="btn primary" id="lightbox-insert">Insert into HTML</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/xml/xml.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/css/css.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/htmlmixed/htmlmixed.min.js"></script>
<script src="site.js"></script>
<script>
const API_BASE = "https://thebrewery.crysthigpen.workers.dev";

let currentSlug = null;
let isPublic = false;
let dirty = false;

// ---------- Auth ----------

// Pulls the worker's { error: "..." } message out of a failed response.
async function apiError(res) {
  try { const j = await res.json(); if (j && j.error) return j.error; } catch {}
  return `Server error ${res.status}`;
}

// Every API call goes through here so the login token is sent as a bearer header.
// (Cross-site cookies between pages.dev and workers.dev are blocked by browsers.)
function apiFetch(url, opts = {}) {
  const token = localStorage.getItem("brewery_token");
  return fetch(url, {
    ...opts,
    credentials: "include",
    headers: { ...(opts.headers || {}), ...(token ? { Authorization: `Bearer ${token}` } : {}) },
  });
}

async function checkAuth() {
  try {
    const res = await apiFetch(`${API_BASE}/api/session`, { credentials: "include" });
    if (res.ok) localStorage.setItem("brewery_editor", "1");
    return res.ok;
  } catch { return false; }
}

document.getElementById("login-pass").addEventListener("keydown", (e) => {
  if (e.key === "Enter") document.getElementById("login-btn").click();
});

document.getElementById("login-btn").addEventListener("click", async () => {
  const username = document.getElementById("login-user").value.trim();
  const password = document.getElementById("login-pass").value;
  const errorEl = document.getElementById("login-error");
  errorEl.style.display = "none";

  try {
    const res = await apiFetch(`${API_BASE}/api/login`, {
      method: "POST",
      credentials: "include",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username, password }),
    });
    if (!res.ok) throw new Error("bad login");
    const { token } = await res.json();
    if (token) localStorage.setItem("brewery_token", token);
    localStorage.setItem("brewery_editor", "1");
    await enterEditor();
  } catch {
    errorEl.style.display = "block";
  }
});

document.getElementById("logout-btn").addEventListener("click", () => {
  document.cookie = "session=; Path=/; Max-Age=0";
  localStorage.removeItem("brewery_token");
  localStorage.removeItem("brewery_editor");
  document.getElementById("editor-screen").style.display = "none";
  document.getElementById("login-screen").style.display = "flex";
});

async function enterEditor() {
  renderNav(null);
  document.getElementById("login-screen").style.display = "none";
  document.getElementById("editor-screen").style.display = "block";
  initEditors();
  await loadMembers();
  await loadTagSuggestions();
  await loadCharacterList();

  const qs = new URLSearchParams(window.location.search);
  const requestedSlug = qs.get("slug");
  if (qs.get("new")) {
    resetForm();
    if (qs.get("collection")) document.getElementById("f-collection").value = qs.get("collection");
    if (requestedSlug) document.getElementById("f-slug").value = requestedSlug;
    if (qs.get("name")) document.getElementById("f-name").value = qs.get("name");
    applyMode();
  } else if (requestedSlug) {
    document.getElementById("slug-select").value = requestedSlug;
    loadCharacter(requestedSlug);
  }
}

async function loadMembers() {
  const select = document.getElementById("f-collection");
  const opts = SITE.sections.map((x) => [x.collection, x.label]).concat([[SITE.homeCollection, "Site page (home / about us)"]]);
  select.innerHTML = opts.map(([v, l]) => `<option value="${escapeAttr(v)}">${escapeHtml(l)}</option>`).join("");
  select.onchange = () => { flushTab(); markDirty(); applyMode(); };
}

async function loadTagSuggestions() {
  const res = await apiFetch(`${API_BASE}/api/tags`, { credentials: "include" });
  const tags = res.ok ? await res.json() : [];
  const datalist = document.getElementById("tag-suggestions");
  datalist.innerHTML = tags.map((t) => `<option value="${escapeAttr(t)}">`).join("");
}

// ---------- Section modes: world tabs + co-owners ----------

let worldTabs = {};   // id -> {title, html}
let activeTab = "main";
let loadedMeta = {};
let quiet = false;    // true while we swap editor text programmatically
const sec = () => sectionOf(document.getElementById("f-collection").value) || {};

const ownerBox = document.getElementById("owner-inputs");
ownerBox.innerHTML = Array.from({ length: SITE.maxOwners }, (_, i) =>
  `<input placeholder="Owner ${i + 1}" style="margin-bottom:6px">`).join("");
ownerBox.querySelectorAll("input").forEach((i) => i.addEventListener("input", markDirty));
const getOwners = () => [...ownerBox.querySelectorAll("input")].map((i) => i.value.trim()).filter(Boolean);
const setOwners = (list) => ownerBox.querySelectorAll("input").forEach((i, n) => { i.value = list[n] || ""; });

function flushTab() {
  if (activeTab !== "main" && activeTab !== "css") worldTabs[activeTab] = { ...(worldTabs[activeTab] || {}), html: cmHtml.getValue() };
}

function renderCodeTabs() {
  const world = sec().worlds;
  const defs = world ? SITE.worldTabs : [{ id: "main", label: "HTML" }];
  if (!world && activeTab !== "css") activeTab = "main";
  if (world && activeTab === "main") activeTab = defs[0].id;
  document.getElementById("code-tabs").innerHTML = [...defs, { id: "css", label: "CSS" }].map((d) => {
    const t = worldTabs[d.id] || {};
    const filled = world && t.html && t.html.trim();
    return `<button type="button" data-tab="${d.id}" class="${d.id === activeTab ? "active" : ""}${filled ? " has" : ""}">${escapeHtml((d.custom && t.title) || d.label)}</button>`;
  }).join("");
  document.querySelectorAll("#code-tabs button").forEach((b) => b.addEventListener("click", () => selectTab(b.dataset.tab)));
  document.getElementById("wrap-html").classList.toggle("active", activeTab !== "css");
  document.getElementById("wrap-css").classList.toggle("active", activeTab === "css");
  const custom = defs.find((d) => d.id === activeTab && d.custom);
  document.getElementById("tab-title-field").style.display = custom ? "block" : "none";
  if (custom) document.getElementById("f-tab-title").value = (worldTabs[activeTab] || {}).title || "";
  if (cmHtml) (activeTab === "css" ? cmCss : cmHtml).refresh();
}

function selectTab(id) {
  if (id !== activeTab) {
    flushTab();
    activeTab = id;
    if (sec().worlds && id !== "css") { quiet = true; cmHtml.setValue((worldTabs[id] || {}).html || ""); quiet = false; }
  }
  renderCodeTabs();
}

document.getElementById("f-tab-title").addEventListener("input", (e) => {
  worldTabs[activeTab] = { ...(worldTabs[activeTab] || {}), title: e.target.value };
  const b = document.querySelector(`#code-tabs button[data-tab="${activeTab}"]`);
  if (b) b.textContent = e.target.value || SITE.worldTabs.find((d) => d.id === activeTab).label;
  markDirty();
});

function applyMode() {
  const s = sec();
  document.getElementById("owners-field").style.display = s.coOwned ? "block" : "none";
  document.getElementById("f-avatar-url").previousElementSibling.textContent = s.worlds ? "Banner image" : "Avatar";
  renderCodeTabs();
}

function buildHtml() {
  flushTab();
  const s = sec(), meta = { ...loadedMeta };
  if (s.coOwned) { const o = getOwners(); if (o.length) meta.owners = o; else delete meta.owners; }
  if (s.worlds) return buildProfile(meta, SITE.worldTabs.map((d) => {
    const t = worldTabs[d.id] || {};
    return { id: d.id, title: d.custom ? (t.title || "") : "", html: t.html || "" };
  }));
  return buildProfile(meta, null, cmHtml.getValue());
}

// ---------- Code editors ----------

let cmHtml, cmCss;

function initEditors() {
  if (cmHtml) return; // already initialized
  cmHtml = CodeMirror.fromTextArea(document.getElementById("cm-html"), {
    mode: "htmlmixed", theme: "dracula", lineNumbers: true, lineWrapping: true,
  });
  cmCss = CodeMirror.fromTextArea(document.getElementById("cm-css"), {
    mode: "css", theme: "dracula", lineNumbers: true, lineWrapping: true,
  });
  [cmHtml, cmCss].forEach((cm) => cm.on("change", () => { if (!quiet) markDirty(); updatePreview(); }));

  renderCodeTabs();
}

function updatePreview() {
  const html = cmHtml.getValue();
  const css = cmCss.getValue();
  // Full-page reach on purpose — the iframe is its own isolated document, so there's no
  // leak risk, and this needs to match what profile.html actually renders (raw, unscoped
  // profile_css) rather than the old boxed .char-{slug}-prefixed preview.
  const doc = `<!DOCTYPE html><html><head>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
    body{margin:0;font-family:sans-serif;background:#fff;color:#111}
    ${css}
  </style></head><body>${html}</body></html>`;
  document.getElementById("preview-frame").srcdoc = doc;
}

// ---------- Character list / load / save ----------

async function loadCharacterList() {
  const res = await apiFetch(`${API_BASE}/api/characters`, { credentials: "include" });
  const characters = await res.json();
  const select = document.getElementById("slug-select");
  select.innerHTML = `<option value="">+ New character</option>` +
    characters.map((c) => `<option value="${c.slug}">${c.name || c.slug}</option>`).join("");
  select.onchange = () => select.value ? loadCharacter(select.value) : resetForm();
}

let currentTags = [];

async function loadCharacter(slug) {
  const res = await apiFetch(`${API_BASE}/api/characters/${slug}`, { credentials: "include" });
  if (!res.ok) return resetForm();
  const c = await res.json();
  currentSlug = c.slug;
  const vl = document.getElementById("view-link");
  vl.href = `profile.html?slug=${encodeURIComponent(c.slug)}`;
  vl.style.display = "inline";
  isPublic = c.visibility === "public";

  document.getElementById("f-name").value = c.name || "";
  document.getElementById("f-slug").value = c.slug || "";
  const colSel = document.getElementById("f-collection");
  if (c.collection && ![...colSel.options].some((o) => o.value === c.collection)) colSel.add(new Option(c.collection, c.collection));
  colSel.value = c.collection || "";
  document.getElementById("f-avatar-url").value = c.avatar_url || "";
  document.getElementById("f-artist").value = c.artist || "";
  document.getElementById("f-designer").value = c.designer || "";
  document.getElementById("f-artist-url").value = c.artist_url || "";
  document.getElementById("f-designer-url").value = c.designer_url || "";
  currentTags = Array.isArray(c.tags) ? [...c.tags] : [];
  renderTagPills();
  const p = parseProfile(c.profile_html);
  worldTabs = {};
  p.tabs.forEach((t) => { worldTabs[t.id] = { title: t.title, html: t.html }; });
  if (sec().worlds && !p.tabs.length && p.body) worldTabs.overview = { html: p.body };
  loadedMeta = p.meta;
  setOwners(p.meta.owners || []);
  activeTab = sec().worlds ? (SITE.worldTabs.find((d) => worldTabs[d.id] && worldTabs[d.id].html) || SITE.worldTabs[0]).id : "main";
  cmHtml.setValue(sec().worlds ? (worldTabs[activeTab] || {}).html || "" : p.body);
  cmCss.setValue(c.profile_css || "");
  applyMode();
  setVisibilitySwitch(isPublic);
  updatePreview();
  markClean();
  loadGallery(c.slug);
}

function resetForm() {
  currentSlug = null;
  document.getElementById("view-link").style.display = "none";
  ["f-name","f-slug","f-artist","f-designer","f-artist-url","f-designer-url","f-avatar-url"].forEach(id => document.getElementById(id).value = "");
  document.getElementById("f-collection").selectedIndex = 0;
  currentTags = [];
  renderTagPills();
  worldTabs = {}; loadedMeta = {}; activeTab = "main"; setOwners([]);
  cmHtml.setValue("");
  cmCss.setValue("");
  applyMode();
  setVisibilitySwitch(false);
  updatePreview();
  markClean();
  loadGallery(null);
}

function renderTagPills() {
  const wrap = document.getElementById("tag-pills");
  wrap.innerHTML = currentTags.map((tag, i) => `
    <span class="tag-pill">${escapeHtml(tag)}<button type="button" class="tag-pill-remove" data-index="${i}">&times;</button></span>
  `).join("");
  wrap.querySelectorAll(".tag-pill-remove").forEach((btn) => {
    btn.addEventListener("click", () => {
      currentTags.splice(Number(btn.dataset.index), 1);
      renderTagPills();
      markDirty();
    });
  });
}

function addTagFromInput() {
  const input = document.getElementById("f-tag-input");
  const value = input.value.trim();
  if (!value) return;
  if (!currentTags.some((t) => t.toLowerCase() === value.toLowerCase())) {
    currentTags.push(value);
    renderTagPills();
    markDirty();
  }
  input.value = "";
}

document.getElementById("add-tag-btn").addEventListener("click", addTagFromInput);
document.getElementById("f-tag-input").addEventListener("keydown", (e) => {
  if (e.key === "Enter") { e.preventDefault(); addTagFromInput(); }
});

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
}

document.getElementById("save-btn").addEventListener("click", async () => {
  const slug = document.getElementById("f-slug").value.trim();
  if (!slug) { alert("Give the character a slug first."); return; }

  setStatus("saving");
  const body = {
    name: document.getElementById("f-name").value,
    collection: document.getElementById("f-collection").value,
    avatar_url: document.getElementById("f-avatar-url").value,
    tags: currentTags,
    profile_html: buildHtml(),
    profile_css: cmCss.getValue(),
    artist: document.getElementById("f-artist").value,
    artist_url: document.getElementById("f-artist-url").value,
    designer: document.getElementById("f-designer").value,
    designer_url: document.getElementById("f-designer-url").value,
    visibility: isPublic ? "public" : "draft",
  };

  const res = await apiFetch(`${API_BASE}/api/characters/${slug}`, {
    method: "POST",
    credentials: "include",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });

  if (res.ok) { markClean(); await loadCharacterList(); }
  else {
    setStatus("error");
    alert(res.status === 401
      ? "Your session expired. Reload the page and sign in again (your edits stay in the editor until you do)."
      : `Save failed: ${await apiError(res)}`);
  }
});

document.getElementById("visibility-switch").addEventListener("click", () => {
  setVisibilitySwitch(!isPublic);
  markDirty();
});
function setVisibilitySwitch(val) {
  isPublic = val;
  document.getElementById("visibility-switch").classList.toggle("on", val);
}

// ---------- Upload gallery + lightbox (persistent, per character) ----------

let galleryItems = []; // [{id, url, name, credits}] — loaded from /api/gallery/:slug

async function loadGallery(slug) {
  galleryItems = [];
  if (!slug) return renderGallery();
  try {
    const res = await apiFetch(`${API_BASE}/api/gallery/${encodeURIComponent(slug)}`, { credentials: "include" });
    galleryItems = res.ok ? await res.json() : [];
  } catch {
    galleryItems = [];
  }
  renderGallery();
}

const uploadZone = document.getElementById("upload-zone");
const uploadInput = document.getElementById("upload-input");
let pendingUploads = []; // in-flight or failed: {name, error}

function slugify(s) {
  return s.toLowerCase().normalize("NFKD").replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
}
function ensureSlug() {
  const el = document.getElementById("f-slug");
  if (!el.value.trim()) el.value = slugify(document.getElementById("f-name").value);
  return el.value.trim();
}

uploadZone.addEventListener("click", () => uploadInput.click());
uploadInput.addEventListener("change", () => { uploadFiles([...uploadInput.files]); uploadInput.value = ""; });
["dragenter", "dragover"].forEach((ev) => uploadZone.addEventListener(ev, (e) => { e.preventDefault(); uploadZone.classList.add("drag"); }));
["dragleave", "drop"].forEach((ev) => uploadZone.addEventListener(ev, (e) => { e.preventDefault(); uploadZone.classList.remove("drag"); }));
uploadZone.addEventListener("drop", (e) => uploadFiles([...e.dataTransfer.files]));
// A missed drop shouldn't navigate the browser away from unsaved work.
window.addEventListener("dragover", (e) => e.preventDefault());
window.addEventListener("drop", (e) => e.preventDefault());
document.addEventListener("paste", (e) => {
  const files = [...(e.clipboardData?.files || [])];
  if (files.length) uploadFiles(files);
});

// Big photos get scaled down before upload (max 2400px) so uploads are fast and don't time out.
async function shrink(file) {
  if (file.type === "image/gif" || file.type === "image/svg+xml" || file.size < 1.5 * 1024 * 1024) return file;
  try {
    const bmp = await createImageBitmap(file);
    const scale = Math.min(1, 2400 / Math.max(bmp.width, bmp.height));
    const c = document.createElement("canvas");
    c.width = Math.round(bmp.width * scale);
    c.height = Math.round(bmp.height * scale);
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    const png = file.type === "image/png";
    const type = png ? "image/png" : "image/jpeg";
    const blob = await new Promise((r) => c.toBlob(r, type, 0.9));
    if (blob && blob.size < file.size) return new File([blob], file.name.replace(/\.\w+$/, png ? ".png" : ".jpg"), { type });
  } catch {}
  return file;
}

async function uploadFiles(files) {
  files = files.filter((f) => f.type.startsWith("image/"));
  if (!files.length) return;
  const slug = ensureSlug();
  if (!slug) { alert("Type a name first so the gallery has somewhere to live."); return; }

  for (const file of files) {
    const p = { name: file.name, error: null };
    pendingUploads.push(p);
    renderGallery();
    try {
      const form = new FormData();
      form.append("file", await shrink(file));
      form.append("slug", slug);
      const res = await apiFetch(`${API_BASE}/api/upload`, { method: "POST", credentials: "include", body: form });
      if (!res.ok) throw new Error(res.status === 401 ? "Session expired: reload and sign in" : await apiError(res));
      const item = await res.json();
      galleryItems.push(item);
      pendingUploads = pendingUploads.filter((x) => x !== p);
      const av = document.getElementById("f-avatar-url");
      if (!av.value.trim()) { av.value = item.url; markDirty(); } // first image becomes the avatar
    } catch (err) {
      p.error = err.message === "Failed to fetch" ? "Couldn't reach server" : err.message;
    }
    renderGallery();
  }
}

function renderGallery() {
  const gallery = document.getElementById("upload-gallery");
  const pend = pendingUploads.map((p, i) => `
    <button type="button" class="gallery-thumb pending${p.error ? " err" : ""}" data-pending="${i}"
      title="${escapeAttr(p.error ? p.name + ": " + p.error + " (click to dismiss)" : p.name)}">
      ${p.error ? "&#10005; " + escapeAttr(p.error) : "Uploading&hellip;"}
    </button>`).join("");
  gallery.innerHTML = pend + galleryItems.map((img, i) => `
    <button type="button" class="gallery-thumb" data-index="${i}">
      <img src="${img.url}" alt="${escapeAttr(img.name)}" loading="lazy">
    </button>
  `).join("");
  gallery.querySelectorAll(".gallery-thumb[data-index]").forEach((btn) => {
    btn.addEventListener("click", () => openLightbox(galleryItems[Number(btn.dataset.index)]));
  });
  gallery.querySelectorAll(".gallery-thumb[data-pending]").forEach((btn) => {
    btn.addEventListener("click", () => {
      const p = pendingUploads[Number(btn.dataset.pending)];
      if (p && p.error) { pendingUploads = pendingUploads.filter((x) => x !== p); renderGallery(); }
    });
  });
}

function escapeAttr(str) {
  return String(str).replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
}

let lightboxImage = null;
let lightboxCredits = []; // working copy: [{role, name, url}, ...] — edited live, saved on demand

function openLightbox(image) {
  lightboxImage = image;
  lightboxCredits = (image.credits || []).map((c) => ({ ...c })); // clone so cancel-by-closing doesn't mutate
  document.getElementById("lightbox-img").src = image.url;
  document.getElementById("lightbox-img").alt = image.name;
  if (lightboxCredits.length === 0) lightboxCredits.push({ role: "", name: "", url: "" });
  renderCreditRows();
  document.getElementById("lightbox").style.display = "flex";
}
function closeLightbox() {
  saveCredits(true); // closing no longer throws away credit edits
  document.getElementById("lightbox").style.display = "none";
  lightboxImage = null;
}

function renderCreditRows() {
  const list = document.getElementById("lightbox-credits-list");
  list.innerHTML = lightboxCredits.map((c, i) => `
    <div class="credit-row" data-index="${i}">
      <input class="credit-role" placeholder="Role" value="${escapeAttr(c.role || "")}" data-field="role">
      <input class="credit-name" placeholder="Name" value="${escapeAttr(c.name || "")}" data-field="name">
      <input class="credit-url" placeholder="Link (optional)" value="${escapeAttr(c.url || "")}" data-field="url">
      <button type="button" class="credit-row-remove" title="Remove">&times;</button>
    </div>
  `).join("");

  list.querySelectorAll(".credit-row").forEach((row) => {
    const i = Number(row.dataset.index);
    row.querySelectorAll("input").forEach((input) => {
      input.addEventListener("input", () => {
        lightboxCredits[i][input.dataset.field] = input.value;
      });
    });
    row.querySelector(".credit-row-remove").addEventListener("click", () => {
      lightboxCredits.splice(i, 1);
      renderCreditRows();
    });
  });
}

document.getElementById("lightbox-add-credit").addEventListener("click", () => {
  lightboxCredits.push({ role: "", name: "", url: "" });
  renderCreditRows();
  const rows = document.querySelectorAll(".credit-row");
  const newRow = rows[rows.length - 1];
  if (newRow) {
    newRow.scrollIntoView({ block: "nearest" });
    newRow.querySelector(".credit-role")?.focus();
  }
});

document.getElementById("lightbox-close").addEventListener("click", closeLightbox);
document.getElementById("lightbox").addEventListener("click", (e) => {
  if (e.target.id === "lightbox") closeLightbox(); // click outside the image
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && document.getElementById("lightbox").style.display !== "none") closeLightbox();
});

document.getElementById("lightbox-copy").addEventListener("click", async () => {
  if (!lightboxImage) return;
  await navigator.clipboard.writeText(lightboxImage.url);
  flashButton("lightbox-copy", "Copied!");
});

async function saveCredits(silent) {
  if (!lightboxImage) return;
  const img = lightboxImage;
  const credits = lightboxCredits.filter((c) => (c.role || "").trim() || (c.name || "").trim() || (c.url || "").trim());
  if (JSON.stringify(credits) === JSON.stringify(img.credits || [])) {
    if (!silent) flashButton("lightbox-save", "Saved!");
    return;
  }
  const slug = document.getElementById("f-slug").value.trim();
  try {
    const res = await apiFetch(`${API_BASE}/api/gallery/${slug}/${img.id}`, {
      method: "POST",
      credentials: "include",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name: img.name, credits }),
    });
    if (res.ok) { img.credits = credits; if (!silent) flashButton("lightbox-save", "Saved!"); }
    else if (!silent) flashButton("lightbox-save", "Failed");
  } catch { if (!silent) flashButton("lightbox-save", "Failed"); }
}
document.getElementById("lightbox-save").addEventListener("click", () => saveCredits(false));

document.getElementById("lightbox-delete").addEventListener("click", async () => {
  if (!lightboxImage) return;
  if (!confirm("Delete this image? This can't be undone.")) return;
  const slug = document.getElementById("f-slug").value.trim();
  const res = await apiFetch(`${API_BASE}/api/gallery/${slug}/${lightboxImage.id}`, {
    method: "DELETE",
    credentials: "include",
  });
  if (res.ok) {
    galleryItems = galleryItems.filter((img) => img.id !== lightboxImage.id);
    renderGallery();
    lightboxImage = null; // deleted: don't try to save credits for it
    closeLightbox();
  } else {
    flashButton("lightbox-delete", "Failed");
  }
});

document.getElementById("lightbox-avatar").addEventListener("click", () => {
  if (!lightboxImage) return;
  document.getElementById("f-avatar-url").value = lightboxImage.url;
  markDirty();
  flashButton("lightbox-avatar", "Set!");
});

document.getElementById("lightbox-insert").addEventListener("click", () => {
  if (!lightboxImage || !cmHtml) return;
  const tag = `<img src="${lightboxImage.url}" alt="${escapeAttr(lightboxImage.name)}">`;
  const cursor = cmHtml.getCursor();
  cmHtml.replaceRange(tag, cursor);
  closeLightbox();
});

function flashButton(id, message) {
  const btn = document.getElementById(id);
  const original = btn.textContent;
  btn.textContent = message;
  setTimeout(() => { btn.textContent = original; }, 1200);
}

// ---------- Dirty state ----------

function markDirty() { dirty = true; setStatus("dirty"); }
function markClean() { dirty = false; setStatus("clean"); }
function setStatus(state) {
  const pill = document.getElementById("status-pill");
  pill.classList.remove("saved","saving");
  if (state === "dirty") pill.textContent = "Unsaved changes";
  if (state === "clean") { pill.textContent = "Saved"; pill.classList.add("saved"); }
  if (state === "saving") { pill.textContent = "Saving…"; pill.classList.add("saving"); }
  if (state === "error") pill.textContent = "Save failed";
}
window.addEventListener("beforeunload", (e) => { if (dirty) e.preventDefault(); });

["f-name","f-slug","f-artist","f-designer","f-artist-url","f-designer-url","f-avatar-url"].forEach((id) => {
  document.getElementById(id).addEventListener("input", markDirty);
});

// ---------- Delete character ----------

document.getElementById("delete-btn").addEventListener("click", async () => {
  const slug = currentSlug;
  if (!slug) { alert("Pick a saved character from the dropdown first."); return; }
  const name = document.getElementById("f-name").value || slug;
  if (!confirm(`Delete "${name}"? This can't be undone.`)) return;

  try {
    const res = await apiFetch(`${API_BASE}/api/characters/${encodeURIComponent(slug)}`, {
      method: "DELETE",
      credentials: "include",
    });
    if (!res.ok) {
      alert(res.status === 401
        ? "Your session expired. Reload the page and sign in again."
        : `Delete failed: ${await apiError(res)}`);
      return;
    }
    resetForm();
    await loadCharacterList();
    document.getElementById("slug-select").value = "";
  } catch {
    alert("Couldn't reach the server.");
  }
});

// ---------- Small conveniences ----------

let lastAutoSlug = "";
document.getElementById("f-name").addEventListener("input", (e) => {
  const slugEl = document.getElementById("f-slug");
  if (!currentSlug && (!slugEl.value || slugEl.value === lastAutoSlug)) {
    lastAutoSlug = slugify(e.target.value);
    slugEl.value = lastAutoSlug;
  }
});
document.addEventListener("keydown", (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s") {
    e.preventDefault();
    if (document.getElementById("editor-screen").style.display !== "none") document.getElementById("save-btn").click();
  }
});

// ---------- Boot ----------

checkAuth().then((ok) => { if (ok) enterEditor(); });
</script>
