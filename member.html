<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Member gallery</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Saira+Extra+Condensed:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css">
</head>
<body>

<div class="wrap">
  <div id="site-nav"></div>

  <div id="header">
    <div class="skeleton" style="width:220px;height:28px;border-radius:6px;margin-bottom:10px"></div>
  </div>

  <input type="text" id="search-input" class="search-input" placeholder="Search by name or tag...">

  <div id="state" class="state" style="display:none"></div>

  <div class="grid" id="grid"></div>
</div>

<script src="site.js"></script>
<script>
const API_BASE = "https://thebrewery.crysthigpen.workers.dev";
const authHeaders = () => {
  const t = localStorage.getItem("brewery_token");
  return t ? { Authorization: `Bearer ${t}` } : {};
};

const params = new URLSearchParams(window.location.search);
const collection = params.get("collection");

let isAuthed = false;
let allCharacters = [];

renderNav(collection);
renderChrome(collection);
checkAuth().then((authed) => {
  isAuthed = authed;
  if (collection) loadMember(collection);
  else location.replace("index.html");
});


document.getElementById("search-input").addEventListener("input", (e) => {
  applySearch(e.target.value);
});

function applySearch(query) {
  const q = query.trim().toLowerCase();
  if (!q) {
    renderGrid(allCharacters);
    return;
  }
  const filtered = allCharacters.filter((c) => {
    const nameMatch = (c.name || c.slug || "").toLowerCase().includes(q);
    const tagMatch = (c.tags || []).some((t) => t.toLowerCase().includes(q));
    return nameMatch || tagMatch;
  });
  renderGrid(filtered, true);
}

async function checkAuth() {
  try {
    const res = await fetch(`${API_BASE}/api/session`, { credentials: "include", headers: authHeaders() });
    if (res.ok) localStorage.setItem("brewery_editor", "1");
    return res.ok || localStorage.getItem("brewery_editor") === "1";
  } catch {
    return localStorage.getItem("brewery_editor") === "1";
  }
}

async function loadMember(collection) {
  document.getElementById("grid").innerHTML = Array(6).fill(
    '<div class="glass card skeleton-card"><div class="skeleton"></div></div>'
  ).join("");

  try {
    const res = await fetch(`${API_BASE}/api/characters?collection=${encodeURIComponent(collection)}`, { credentials: "include" });
    if (!res.ok) {
      let why = ""; try { why = (await res.json()).error || ""; } catch {}
      return showState(`Couldn't load this gallery (error ${res.status}${why ? ": " + why : ""}).`);
    }
    const characters = await res.json();
    allCharacters = characters;
    renderHeader(collection, characters.length);
    renderGrid(characters);
  } catch {
    showState("Couldn't load this gallery right now.");
  }
}

function renderHeader(collection, count) {
  const s = sectionOf(collection), label = s ? s.label : collection, noun = s && s.worlds ? "world" : "character";
  document.title = `${label} — gallery`;
  document.getElementById("header").innerHTML = `
    <h1 id="member-title" class="sr-only">${escapeHtml(label)}</h1>
    <p id="member-count">${count} public ${noun}${count === 1 ? "" : "s"}${isAuthed ? ` &middot; <a href="editor.html?new=1&collection=${encodeURIComponent(collection)}">+ New ${noun}</a>` : ""}</p>
  `;
}

function renderGrid(characters, isSearchResult) {
  const grid = document.getElementById("grid");
  if (characters.length === 0) {
    grid.innerHTML = "";
    return showState(isSearchResult ? "No characters match that search." : "No public characters here yet.");
  }
  document.getElementById("state").style.display = "none";
  const worlds = (sectionOf(collection) || {}).worlds;
  grid.className = worlds ? "grid worlds" : "grid";
  const card = (c) => `
    <div class="glass card">
      <a class="card-link" href="${worlds ? "world" : "profile"}.html?slug=${encodeURIComponent(c.slug)}" aria-label="View ${escapeAttr(c.name || c.slug)}"></a>
      ${isAuthed ? `<a class="card-edit" href="editor.html?slug=${encodeURIComponent(c.slug)}">Edit</a>` : ""}
      ${avatarHtml(c)}
      <p class="card-name">${escapeHtml(c.name || c.slug)}</p>
      <p class="card-meta">${c.artist ? "Art by " + escapeHtml(c.artist) : "&nbsp;"}</p>
      ${tagsHtml(c)}
    </div>
  `;
  const fsec = sectionOf(collection) || {};
  if (fsec.folders) {
    grid.className = "folders";
    const groups = {};
    characters.forEach((c) => { const f = folderOf(c); (groups[f] = groups[f] || []).push(c); });
    const names = Object.keys(groups).sort((a, b) => !a ? 1 : !b ? -1 : a.localeCompare(b));
    grid.innerHTML = names.map((n) => {
      const subs = {}, loose = [];
      groups[n].forEach((c) => { const s = subOf(c); if (s) (subs[s] = subs[s] || []).push(c); else loose.push(c); });
      const subNames = Object.keys(subs).sort((a, b) => a.localeCompare(b));
      return `<details class="folder" open><summary>${escapeHtml(n || "Unsorted")}<span>${groups[n].length}</span></summary>` +
        (loose.length ? `<div class="grid">${loose.map(card).join("")}</div>` : "") +
        subNames.map((s) => `<details class="subfolder" open><summary>${escapeHtml(s)}<span>${subs[s].length}</span></summary><div class="grid">${subs[s].map(card).join("")}</div></details>`).join("") +
        `</details>`;
    }).join(dividerHtml());
  } else grid.innerHTML = characters.map(card).join("");
}

function tagsHtml(c) {
  const tags = visibleTags(c);
  if (!tags.length) return "";
  return `<div class="card-tags">${tags.map((t) => `<span class="card-tag">${escapeHtml(t)}</span>`).join("")}</div>`;
}

function avatarHtml(c) {
  if (c.avatar_url) {
    return `<div class="card-avatar" style="background-image:url('${escapeAttr(c.avatar_url)}')"></div>`;
  }
  const initial = (c.name || c.slug || "?").trim().charAt(0).toUpperCase();
  return `<div class="card-avatar">${escapeHtml(initial)}</div>`;
}

function showState(message) {
  document.getElementById("grid").innerHTML = "";
  const stateEl = document.getElementById("state");
  stateEl.innerHTML = `<div class="big">${escapeHtml(message)}</div><a href="index.html">Back to hub</a>`;
  stateEl.style.display = "block";
}

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
}
function escapeAttr(str) { return escapeHtml(str); }
</script>
</body>
</html>
